 x="188" y="675" width="185" height="48" fill="#e5dfd4"/><text x="215" y="705" font-family="Arial,Helvetica,sans-serif" font-size="13" fill="#242927" >Discover the details</text><text x="187" y="860" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#c2c7be" letter-spacing="2">01 / A DIFFERENT POINT OF VIEW</text><rect x="137" y="186" width="1166" height="736" fill="#e5dfd4"/><text x="190" y="250" font-family="Arial,Helvetica,sans-serif" font-size="30" fill="#242927" >KALDO</text><text x="190" y="345" font-family="Arial,Helvetica,sans-serif" font-size="56" fill="#242927" >A closer look.</text><text x="190" y="392" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#777e76" >A considered system, from the overview to the smallest detail.</text><rect x="190" y="445" width="482" height="380" rx="10" fill="#b49b7d"/><circle cx="430" cy="630" r="120" fill="#e5dfd4" opacity=".45"/><path d="M280 700L350 625L410 651L480 555L560 580" fill="none" stroke="#344c3b" stroke-width="8"/><text x="320" y="560" font-family="Arial,Helvetica,sans-serif" font-size="25" fill="#242927" >A new perspective</text><rect x="714" y="445" width="527" height="90" rx="6" fill="#ffffff66"/><text x="740" y="480" font-family="Arial,Helvetica,sans-serif" font-size="20" fill="#242927" >01 / Thoughtful structure</text><text x="740" y="510" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#737b70" >Clear information, exactly where it belongs.</text><rect x="714" y="560" width="527" height="90" rx="6" fill="#ffffff66"/><text x="740" y="596" font-family="Arial,Helvetica,sans-serif" font-size="20" fill="#242927" >02 / A coherent visual language</text><text x="740" y="625" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#737b70" >One system. Considered in every context.</text><rect x="714" y="675" width="527" height="150" rx="6" fill="#27352a"/><text x="740" y="720" font-family="Arial,Helvetica,sans-serif" font-size="25" fill="#e5dfd4" >Every detail has a purpo