e overview to the smallest detail.</text><rect x="190" y="445" width="482" height="380" rx="10" fill="#cfac84"/><circle cx="430" cy="630" r="120" fill="#f1e9df" opacity=".45"/><path d="M280 700L350 625L410 651L480 555L560 580" fill="none" stroke="#344c3b" stroke-width="8"/><text x="320" y="560" font-family="Arial,Helvetica,sans-serif" font-size="25" fill="#242927" >A new perspective</text><rect x="714" y="445" width="527" height="90" rx="6" fill="#ffffff66"/><text x="740" y="480" font-family="Arial,Helvetica,sans-serif" font-size="20" fill="#242927" >01 / Thoughtful structure</text><text x="740" y="510" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#737b70" >Clear information, exactly where it belongs.</text><rect x="714" y="560" width="527" height="90" rx="6" fill="#ffffff66"/><text x="740" y="596" font-family="Arial,Helvetica,sans-serif" font-size="20" fill="#242927" >02 / A coherent visual language</text><text x="740" y="625" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#737b70" >One system. Considered in every context.</text><rect x="714" y="675" width="527" height="150" rx="6" fill="#27352a"/><text x="740" y="720" font-family="Arial,Helvetica,sans-serif" font-size="25" fill="#f1e9df" >Every detail has a purpose.</text><text x="740" y="763" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#cfac84" letter-spacing="2">DESIGN SYSTEM / INTERFACE EXPLORATION</text><text x="145" y="1003" font-family="Arial,Helvetica,sans-serif" font-size="13" fill="#a5a7ab" letter-spacing="3">CIRCA / INTERFACE STUDY</text><text x="1115" y="1003" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#a5a7ab" letter-spacing="2">LiniWeb</text></svg>