,sans-serif" font-size="20" fill="#242927" >01 / Thoughtful structure</text><text x="740" y="510" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#737b70" >Informasi jelas pada tempatnya.</text><rect x="714" y="560" width="527" height="90" rx="6" fill="#ffffff66"/><text x="740" y="596" font-family="Arial,Helvetica,sans-serif" font-size="20" fill="#242927" >02 / A coherent visual language</text><text x="740" y="625" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#737b70" >Satu sistem untuk beragam konteks.</text><rect x="714" y="675" width="527" height="150" rx="6" fill="#27352a"/><text x="740" y="720" font-family="Arial,Helvetica,sans-serif" font-size="23" fill="#ece9e3" >Setiap detail memiliki tujuan.</text><text x="740" y="763" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#99968d" letter-spacing="2">DESIGN SYSTEM / INTERFACE EXPLORATION</text><text x="145" y="1003" font-family="Arial,Helvetica,sans-serif" font-size="13" fill="#a5a7ab" letter-spacing="3">OBJET / STUDI ANTARMUKA</text><text x="1115" y="1003" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#a5a7ab" letter-spacing="2">LiniWeb</text></svg>