f" font-size="20" fill="#242927" >01 / Thoughtful structure</text><text x="740" y="510" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#737b70" >Clear information, exactly where it belongs.</text><rect x="714" y="560" width="527" height="90" rx="6" fill="#ffffff66"/><text x="740" y="596" font-family="Arial,Helvetica,sans-serif" font-size="20" fill="#242927" >02 / A coherent visual language</text><text x="740" y="625" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#737b70" >One system. Considered in every context.</text><rect x="714" y="675" width="527" height="150" rx="6" fill="#27352a"/><text x="740" y="720" font-family="Arial,Helvetica,sans-serif" font-size="25" fill="#edf0e5" >Every detail has a purpose.</text><text x="740" y="763" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#a5b59b" letter-spacing="2">DESIGN SYSTEM / INTERFACE EXPLORATION</text><text x="145" y="1003" font-family="Arial,Helvetica,sans-serif" font-size="13" fill="#a5a7ab" letter-spacing="3">MORI / INTERFACE STUDY</text><text x="1115" y="1003" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#a5a7ab" letter-spacing="2">TemuWeb</text></svg>